services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      # aponte para o seu Postgres já existente (nome do container na mesma rede, ou host)
      DATABASE_URL: ${DATABASE_URL:?defina DATABASE_URL do seu Postgres}
      PORT: "3335"
      SESSION_SECRET: ${SESSION_SECRET:?defina SESSION_SECRET}
      IP_SALT: ${IP_SALT:?defina IP_SALT}
      ACERVO_DIR: /dados/acervo
      TURNSTILE_SECRET: ${TURNSTILE_SECRET:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@espontaneo.local}
      ADMIN_SENHA: ${ADMIN_SENHA:-espontaneo}
    volumes:
      - acervo:/dados/acervo
    networks:
      - default   # conversa com o web
      - banco      # conversa com o seu Postgres
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/site/Dockerfile
    ports:
      # troque WEB_PORT se a 80 já estiver ocupada na VPS
      - "${WEB_PORT:-80}:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  acervo:

networks:
  # a rede Docker onde o seu container do Postgres já está
  banco:
    external: true
    name: ${DB_NETWORK:?defina DB_NETWORK (a rede do seu Postgres)}
