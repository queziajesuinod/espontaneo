# Postgres só para desenvolvimento local: `pnpm banco:up`.
# Em produção (Portainer) usamos o Postgres que já existe na VPS.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: espontaneo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-espontaneo}
      POSTGRES_DB: espontaneo
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - dados:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U espontaneo"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  dados:
